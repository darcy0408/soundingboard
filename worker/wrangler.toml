name = "soundingboard-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Secrets (NEVER put these here — set via `wrangler secret put <NAME>`):
#   ANTHROPIC_API_KEY   Anthropic API key used for /v1/turn and /v1/feedback
#   CARTESIA_API_KEY    Cartesia TTS API key used for /v1/tts (optional —
#                        if unset, /v1/tts returns 501 and the app falls
#                        back to on-device TTS)
#
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put CARTESIA_API_KEY
# ---------------------------------------------------------------------------

[vars]
# Non-secret config. CORS allow-origin. The native app sends no Origin header,
# so CORS never applies to it — this fixed value exists purely to stop browser
# JS on arbitrary websites from calling the API (SPEC.md §3: "CORS locked to
# app"). There is no legitimate web client (no web app, per the cut list), so
# the value is an intentionally dead origin.
ALLOWED_ORIGIN = "https://no-web-clients.soundingboard.invalid"

# ---------------------------------------------------------------------------
# KV namespace for per-device rate limiting (SPEC.md §3, §4).
# Placeholder id below — replace after running:
#   wrangler kv namespace create RATE_LIMIT
# and pasting the returned id here (and a second one for `preview_id` from
# `wrangler kv namespace create RATE_LIMIT --preview` for local dev).
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "3ead3f38cd444dbe8b60596a7efdf9d3"
preview_id = "b330ba1ac3a544d59f6b262d2cccc0d4"
